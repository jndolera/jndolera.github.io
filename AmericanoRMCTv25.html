<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>RMCT - Americano Revés vs Drive</title>
<style>
:root{--rmct-blue:#0057b8;--rmct-dark:#001b3d;--rmct-gold:#d9b46b;--reves-bg:#e3f2ff;--drive-bg:#fdf2e9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:linear-gradient(135deg,var(--rmct-dark) 0%,var(--rmct-blue) 100%);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;padding:6px}
.container{max-width:100%;margin:0 auto;background:#f4f7fb;border-radius:15px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.4)}
.header{background:#fff;padding:8px 10px;text-align:center;border-bottom:3px solid var(--rmct-gold)}
.header img{width:110px;margin-bottom:4px}
.tournament-title{margin:0;font-size:1rem;color:var(--rmct-dark);font-weight:800;text-transform:uppercase;letter-spacing:.5px}
.badges{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:5px}
.badge{background:var(--rmct-blue);color:#fff;padding:3px 8px;border-radius:50px;font-size:.65rem;font-weight:700}
.section{padding:8px 10px;border-bottom:1px solid #ddd}
.section-title{font-size:.8rem;font-weight:800;color:var(--rmct-blue);margin-bottom:8px;text-transform:uppercase}
.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.column-label{font-size:.6rem;font-weight:900;text-align:center;color:#666;margin-bottom:3px;letter-spacing:.5px}
input,select{width:100%;padding:9px 8px;border:1px solid #ccc;border-radius:8px;font-size:.8rem;outline:none;text-transform:uppercase;font-weight:700;background:#fff}
input[type="date"],input[type="time"]{text-transform:none}
.in-reves{border-left:4px solid #0077ff;background:var(--reves-bg)}
.in-drive{border-left:4px solid #ff8800;background:var(--drive-bg)}
.btn{background:var(--rmct-blue);color:#fff;border:none;padding:12px;border-radius:50px;width:100%;font-weight:800;cursor:pointer;margin-top:10px;box-shadow:0 4px 10px rgba(0,0,0,.2);font-size:.9rem}
.btn-compartir{background:#25D366;margin-top:6px}
.ronda-card{background:#fff;margin-bottom:10px;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.ronda-header{background:var(--rmct-dark);color:#fff;padding:8px 12px;font-weight:800;font-size:1rem;letter-spacing:.5px}
.pista-box{padding:10px;border-bottom:1px solid #f0f0f0}
.pista-box:last-child{border-bottom:none}
.pista-label{font-size:.65rem;font-weight:800;color:#999;margin-bottom:6px;display:block;letter-spacing:1px}
.match-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pareja-box{flex:1;min-width:0;background:#f8f9fa;padding:8px 6px;border-radius:8px;text-align:center;overflow:hidden}
.pareja-box span{display:block;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.05rem;line-height:1.3}
.p-reves{color:#0056b3}
.p-drive{color:#b35f00}
.marcador{display:flex;align-items:center;gap:4px;flex-shrink:0}
.score-input{width:38px;padding:8px 0;text-align:center;font-weight:900;font-size:1.05rem;border:2px solid #ddd;border-radius:8px;background:#fff}
.score-input:focus{border-color:var(--rmct-blue);outline:none}
.rank-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:#fff;margin-bottom:4px;border-radius:10px}
.rank-info{display:flex;align-items:center;gap:8px;min-width:0}
.rank-pos{font-weight:900;color:var(--rmct-gold);width:18px;text-align:center}
.rank-name{font-weight:700;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank-stats{font-family:monospace;font-weight:700;font-size:.85rem;flex-shrink:0}
.info-box{background:#fffbe6;border-left:3px solid var(--rmct-gold);padding:6px 10px;border-radius:6px;font-size:.68rem;color:#666;margin-top:8px;line-height:1.35}
@media (max-width:400px){
    .pareja-box span{font-size:.98rem}
    .score-input{width:34px;font-size:.95rem}
}
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="https://www.murciaclubdetenis.es/wp-content/uploads/2019/10/logo-menu-1x2.png" alt="Logo RMCT">
        <h1 class="tournament-title" id="dispTorneo">AMERICANO REVES VS DRIVE</h1>
        <div class="badges">
            <span class="badge" id="dispEv">FECHA</span>
            <span class="badge" id="dispCat">CAT: 3ª/4ª</span>
            <span class="badge" id="dispHora">H: 10:00</span>
            <span class="badge" id="dispPistas">2 PISTAS · 8 JUG</span>
        </div>
    </div>

    <div class="section">
        <div class="section-title">⚙️ Datos y Jugadores</div>
        <div class="player-grid" style="margin-bottom:10px">
            <input type="text" id="inTorneo" value="TORNEO RMCT">
            <input type="text" id="inCat" value="3ª/4ª">
            <input type="date" id="inEvento">
            <input type="time" id="inHora" value="10:00">
        </div>
        <div style="margin-bottom:10px">
            <div class="column-label" style="text-align:left;margin-bottom:4px">FORMATO DEL TORNEO</div>
            <select id="inPistas" onchange="actualizarVisibilidadJugadores()">
                <option value="2" selected>2 PISTAS · 8 JUGADORES</option>
                <option value="3">3 PISTAS · 12 JUGADORES</option>
                <option value="4">4 PISTAS · 16 JUGADORES</option>
            </select>
        </div>
        <div class="player-grid">
            <div>
                <div class="column-label">REVESES</div>
                <input type="text" class="in-reves" id="r0" value="1">
                <input type="text" class="in-reves" id="r1" value="3">
                <input type="text" class="in-reves" id="r2" value="5">
                <input type="text" class="in-reves" id="r3" value="7">
                <input type="text" class="in-reves" id="r4" value="9" style="display:none">
                <input type="text" class="in-reves" id="r5" value="11" style="display:none">
                <input type="text" class="in-reves" id="r6" value="13" style="display:none">
                <input type="text" class="in-reves" id="r7" value="15" style="display:none">
            </div>
            <div>
                <div class="column-label">DRIVES</div>
                <input type="text" class="in-drive" id="d0" value="2">
                <input type="text" class="in-drive" id="d1" value="4">
                <input type="text" class="in-drive" id="d2" value="6">
                <input type="text" class="in-drive" id="d3" value="8">
                <input type="text" class="in-drive" id="d4" value="10" style="display:none">
                <input type="text" class="in-drive" id="d5" value="12" style="display:none">
                <input type="text" class="in-drive" id="d6" value="14" style="display:none">
                <input type="text" class="in-drive" id="d7" value="16" style="display:none">
            </div>
        </div>
        <button class="btn" onclick="generarCuadro()">🎯 GENERAR CUADRO</button>
        <div class="info-box" id="infoBox">ℹ️ 2 pistas, 8 jugadores (4 revés + 4 drive), 4 jornadas.</div>
    </div>

    <div class="section" id="sectionPartidos" style="display:none">
        <div class="section-title">🎾 Jornadas de Juego</div>
        <div id="cuadro"></div>
        <button class="btn btn-compartir" id="btnCompartir" onclick="compartirCuadro()" style="display:none">
            📤 COMPARTIR CUADRO POR WHATSAPP
        </button>
    </div>

    <div class="section" id="sectionRanking" style="display:none">
        <div class="section-title">🏆 Clasificación Individual</div>
        <div id="ranking"></div>
        <button class="btn" style="background:#666" onclick="window.location.reload()">🔄 REINICIAR</button>
    </div>
</div>

<script>
var partidosData = [];
var jugadoresGlobal = {};
var N_JORNADAS = 4;

function configPorPistas(pistas) {
    var nJug = pistas * 4;
    return { pistas: pistas, nJug: nJug, nRev: nJug/2, nDri: nJug/2, nJornadas: N_JORNADAS };
}

function formatearFecha(fechaInput) {
    if (!fechaInput) return 'FECHA';
    var partes = fechaInput.split('-');
    var y = parseInt(partes[0]), m = parseInt(partes[1]), d = parseInt(partes[2]);
    var fechaObj = new Date(y, m-1, d);
    var dias = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
    var meses = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
    return dias[fechaObj.getDay()] + ' ' + d + ' DE ' + meses[fechaObj.getMonth()];
}

function actualizarVisibilidadJugadores() {
    var pistas = parseInt(document.getElementById('inPistas').value);
    var cfg = configPorPistas(pistas);
    for (var i = 0; i < 8; i++) {
        var r = document.getElementById('r' + i);
        var d = document.getElementById('d' + i);
        if (r) r.style.display = i < cfg.nRev ? 'block' : 'none';
        if (d) d.style.display = i < cfg.nDri ? 'block' : 'none';
    }
    document.getElementById('dispPistas').innerText = cfg.pistas + ' PISTAS · ' + cfg.nJug + ' JUG';
    document.getElementById('infoBox').innerHTML = 'ℹ️ ' + cfg.pistas + ' pistas, ' + cfg.nJug + ' jugadores (' + cfg.nRev + ' revés + ' + cfg.nDri + ' drive), ' + cfg.nJornadas + ' jornadas.';
}

// ============================================================
// ALGORITMO
// ============================================================
function construirCuadro(pistas) {
    var cfg = configPorPistas(pistas);
    var nRev = cfg.nRev, nDri = cfg.nDri, nJornadas = cfg.nJornadas;

    var reveses = [], drives = [];
    for (var i = 0; i < nRev; i++) reveses.push('r' + i);
    for (var i = 0; i < nDri; i++) drives.push('d' + i);

    var todos = reveses.concat(drives);

    var esqueleto = [];
    for (var j = 0; j < nJornadas; j++) {
        var parejas = [];
        for (var i = 0; i < nRev; i++) {
            parejas.push([reveses[i], drives[(i + j) % nDri]]);
        }
        esqueleto.push(parejas);
    }

    function contarCoincidencias(asig) {
        var coinc = {};
        for (var i = 0; i < todos.length; i++)
            for (var k = i+1; k < todos.length; k++)
                coinc[todos[i] + '|' + todos[k]] = 0;

        for (var j = 0; j < asig.length; j++) {
            for (var p = 0; p < pistas; p++) {
                var pA = asig[j][p*2];
                var pB = asig[j][p*2+1];
                if (!pA || !pB) continue;
                var jug = [pA[0], pA[1], pB[0], pB[1]];
                for (var a = 0; a < 4; a++)
                    for (var b = a+1; b < 4; b++) {
                        var x = jug[a], y = jug[b];
                        var key = x < y ? x+'|'+y : y+'|'+x;
                        coinc[key]++;
                    }
            }
        }
        return coinc;
    }

    function costeCoincidencias(coinc) {
        var coste = 0;
        for (var k in coinc) {
            var v = coinc[k];
            if (v > 1) coste += (v-1)*(v-1) * 1000;
        }
        return coste;
    }

    function asignacionAleatoria() {
        var asig = [];
        for (var j = 0; j < nJornadas; j++) {
            var parejas = esqueleto[j].slice();
            for (var i = parejas.length - 1; i > 0; i--) {
                var k = Math.floor(Math.random() * (i + 1));
                var tmp = parejas[i]; parejas[i] = parejas[k]; parejas[k] = tmp;
            }
            asig.push(parejas);
        }
        return asig;
    }

    var RONDAS = 5;
    var INTENTOS_POR_RONDA = 30000;
    var mejorGlobal = null;
    var mejorCosteGlobal = Infinity;

    for (var ronda = 0; ronda < RONDAS; ronda++) {
        var actual = asignacionAleatoria();
        var mejorLocal = actual.map(function(j) { return j.slice(); });
        var mejorCosteLocal = costeCoincidencias(contarCoincidencias(mejorLocal));

        for (var intento = 0; intento < INTENTOS_POR_RONDA; intento++) {
            var prueba = mejorLocal.map(function(j) { return j.slice(); });
            var j = Math.floor(Math.random() * nJornadas);
            var idxA = Math.floor(Math.random() * prueba[j].length);
            var idxB = Math.floor(Math.random() * prueba[j].length);
            if (idxA === idxB) continue;

            var tmp = prueba[j][idxA];
            prueba[j][idxA] = prueba[j][idxB];
            prueba[j][idxB] = tmp;

            var c = contarCoincidencias(prueba);
            var coste = costeCoincidencias(c);

            if (coste < mejorCosteLocal || (coste === mejorCosteLocal && Math.random() < 0.3)) {
                mejorCosteLocal = coste;
                mejorLocal = prueba;
                if (coste === 0) break;
            }
        }

        if (mejorCosteLocal < mejorCosteGlobal) {
            mejorCosteGlobal = mejorCosteLocal;
            mejorGlobal = mejorLocal;
            if (mejorCosteGlobal === 0) break;
        }
    }

    return { jornadas: mejorGlobal, cfg: cfg, coste: mejorCosteGlobal };
}

// ============================================================
// GENERAR CUADRO
// ============================================================
function generarCuadro() {
    try {
        document.getElementById('dispTorneo').innerText = document.getElementById('inTorneo').value;
        document.getElementById('dispEv').innerText = formatearFecha(document.getElementById('inEvento').value);
        document.getElementById('dispCat').innerText = 'CAT: ' + document.getElementById('inCat').value;
        document.getElementById('dispHora').innerText = 'H: ' + document.getElementById('inHora').value;

        var pistas = parseInt(document.getElementById('inPistas').value);
        var cfg = configPorPistas(pistas);

        jugadoresGlobal = {};
        for (var i = 0; i < cfg.nRev; i++)
            jugadoresGlobal['r' + i] = document.getElementById('r' + i).value.toUpperCase() || ('R' + i);
        for (var i = 0; i < cfg.nDri; i++)
            jugadoresGlobal['d' + i] = document.getElementById('d' + i).value.toUpperCase() || ('D' + i);

        var res = construirCuadro(pistas);
        console.log('Coste de coincidencias:', res.coste);

        var jornadas = res.jornadas;
        partidosData = [];
        var html = '';

        for (var idx = 0; idx < jornadas.length; idx++) {
            var parejas = jornadas[idx];
            html += '<div class="ronda-card"><div class="ronda-header">JORNADA ' + (idx+1) + '</div>';

            for (var pi = 0; pi < pistas; pi++) {
                var pA = parejas[pi*2];
                var pB = parejas[pi*2+1];
                if (!pA || !pB) continue;
                var id = 'j' + idx + 'p' + pi;
                partidosData.push({ id: id, jA: pA, jB: pB, sA: 0, sB: 0 });

                html += '<div class="pista-box">';
                html += '<span class="pista-label">PISTA ' + (pi+1) + '</span>';
                html += '<div class="match-row">';
                html += '<div class="pareja-box">';
                html += '<span class="p-reves">' + jugadoresGlobal[pA[0]] + '</span>';
                html += '<span class="p-drive">' + jugadoresGlobal[pA[1]] + '</span>';
                html += '</div>';
                html += '<div class="marcador">';
                html += '<input type="number" class="score-input" id="scA_' + id + '" onchange="registrar(\'' + id + '\')">';
                html += '<input type="number" class="score-input" id="scB_' + id + '" onchange="registrar(\'' + id + '\')">';
                html += '</div>';
                html += '<div class="pareja-box">';
                html += '<span class="p-reves">' + jugadoresGlobal[pB[0]] + '</span>';
                html += '<span class="p-drive">' + jugadoresGlobal[pB[1]] + '</span>';
                html += '</div>';
                html += '</div></div>';
            }

            html += '</div>';
        }

        document.getElementById('cuadro').innerHTML = html;
        document.getElementById('sectionPartidos').style.display = 'block';
        document.getElementById('sectionRanking').style.display = 'block';
        document.getElementById('btnCompartir').style.display = 'block';

        actualizarRanking();
    } catch (err) {
        console.error('Error:', err);
        alert('Error: ' + err.message);
    }
}

// ============================================================
// COMPARTIR COMO IMAGEN - APROVECHANDO TODO EL ANCHO
// ============================================================
function compartirCuadro() {
    try {
        var pistas = parseInt(document.getElementById('inPistas').value);
        var cfg = configPorPistas(pistas);
        var torneo = document.getElementById('inTorneo').value || 'TORNEO RMCT';
        var fecha = formatearFecha(document.getElementById('inEvento').value);
        var cat = document.getElementById('inCat').value || '';
        var hora = document.getElementById('inHora').value || '';

        var jornadasDOM = document.querySelectorAll('#cuadro .ronda-card');
        if (jornadasDOM.length === 0) {
            alert('Genera primero el cuadro.');
            return;
        }

        // ============================================================
        // CONFIGURACIÓN DE TAMAÑOS (todo el ancho, sin huecos)
        // ============================================================
        var ancho = 1080;
        var padding = 30;
        var separacionBloques = 14;

        // Fuentes GRANDES
        var fTitulo = 'bold 52px Arial, sans-serif';
        var fBadge = 'bold 22px Arial, sans-serif';
        var fListaTitulo = 'bold 26px Arial, sans-serif';
        var fListaJugador = 'bold 28px Arial, sans-serif';
        var fJornada = 'bold 34px Arial, sans-serif';
        var fPistaLabel = 'bold 17px Arial, sans-serif';
        var fJugador = 'bold 50px Arial, sans-serif';
        var fVS = 'bold 32px Arial, sans-serif';

        // Alturas
        var hCabecera = 190;
        var hListaJugadores = 140;
        var hTituloJornada = 65;
        var hPista = 145;

        // ============================================================
        // CÁLCULO EXACTO DE ALTURA
        // ============================================================
        var alturaJornada = hTituloJornada + 8 + (cfg.pistas * hPista) + separacionBloques;
        var alturaTotal = padding
            + hCabecera + separacionBloques
            + hListaJugadores + separacionBloques
            + (jornadasDOM.length * alturaJornada)
            + padding;

        // ============================================================
        // CANVAS
        // ============================================================
        var canvas = document.createElement('canvas');
        canvas.width = ancho;
        canvas.height = alturaTotal;
        var ctx = canvas.getContext('2d');

        ctx.fillStyle = '#f4f7fb';
        ctx.fillRect(0, 0, ancho, alturaTotal);

        var y = padding;

        // ============================================================
        // CABECERA
        // ============================================================
        ctx.fillStyle = '#ffffff';
        roundRect(ctx, padding, y, ancho - padding*2, hCabecera, 18);
        ctx.fill();

        ctx.fillStyle = '#d9b46b';
        ctx.fillRect(padding, y + hCabecera - 6, ancho - padding*2, 6);

        ctx.fillStyle = '#001b3d';
        ctx.font = fTitulo;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(torneo.toUpperCase(), ancho/2, y + 65);

        var badges = [fecha];
        if (cat) badges.push('CAT: ' + cat);
        if (hora) badges.push('H: ' + hora);

        var badgeY = y + 115;
        var badgeHeight = 50;
        var badgePadding = 26;
        var espacio = 16;

        ctx.font = fBadge;
        var anchos = [];
        var anchoTotalBadges = 0;
        for (var i = 0; i < badges.length; i++) {
            var w = ctx.measureText(badges[i]).width + badgePadding * 2;
            anchos.push(w);
            anchoTotalBadges += w;
        }
        anchoTotalBadges += espacio * (badges.length - 1);

        var xBadge = (ancho - anchoTotalBadges) / 2;
        for (var i = 0; i < badges.length; i++) {
            var w = anchos[i];
            ctx.fillStyle = '#0057b8';
            roundRect(ctx, xBadge, badgeY, w, badgeHeight, 25);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(badges[i], xBadge + w/2, badgeY + badgeHeight/2 + 1);
            xBadge += w + espacio;
        }

        y += hCabecera + separacionBloques;

        // ============================================================
        // LISTA DE JUGADORES
        // ============================================================
        ctx.fillStyle = '#ffffff';
        roundRect(ctx, padding, y, ancho - padding*2, hListaJugadores, 18);
        ctx.fill();

        ctx.font = fListaTitulo;
        ctx.textBaseline = 'middle';

        ctx.fillStyle = '#0056b3';
        ctx.textAlign = 'left';
        ctx.fillText('REVÉS:', padding + 25, y + 42);

        ctx.fillStyle = '#b35f00';
        ctx.textAlign = 'left';
        ctx.fillText('DRIVE:', padding + 25, y + 96);

        var listaReveses = [];
        var listaDrives = [];
        for (var i = 0; i < cfg.nRev; i++) {
            if (jugadoresGlobal['r' + i]) listaReveses.push(jugadoresGlobal['r' + i]);
        }
        for (var i = 0; i < cfg.nDri; i++) {
            if (jugadoresGlobal['d' + i]) listaDrives.push(jugadoresGlobal['d' + i]);
        }

        var textoReveses = listaReveses.join('  ·  ');
        var textoDrives = listaDrives.join('  ·  ');

        ctx.font = fListaJugador;
        ctx.fillStyle = '#003a7a';
        ctx.textAlign = 'left';
        ctx.fillText(textoReveses, padding + 180, y + 42);

        ctx.fillStyle = '#7a3d00';
        ctx.textAlign = 'left';
        ctx.fillText(textoDrives, padding + 180, y + 96);

        y += hListaJugadores + separacionBloques;

        // ============================================================
        // JORNADAS - APROVECHANDO TODO EL ANCHO
        // ============================================================
        for (var idx = 0; idx < jornadasDOM.length; idx++) {
            var ronda = jornadasDOM[idx];

            // Título de jornada
            ctx.fillStyle = '#001b3d';
            roundRect(ctx, padding, y, ancho - padding*2, hTituloJornada, 14);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = fJornada;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.fillText('JORNADA ' + (idx+1), padding + 25, y + hTituloJornada/2 + 1);
            y += hTituloJornada + 8;

            var pistasHTML = ronda.querySelectorAll('.pista-box');
            for (var pi = 0; pi < pistasHTML.length; pi++) {
                var pista = pistasHTML[pi];

                // Fondo pista
                ctx.fillStyle = '#ffffff';
                roundRect(ctx, padding, y, ancho - padding*2, hPista - 10, 14);
                ctx.fill();

                // Etiqueta pista
                ctx.fillStyle = '#999999';
                ctx.font = fPistaLabel;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                var pistaLabel = pista.querySelector('.pista-label');
                if (pistaLabel) {
                    ctx.fillText(pistaLabel.innerText, padding + 22, y + 14);
                }

                // ============================================================
                // PAREJAS - APROVECHANDO TODO EL ANCHO
                // ============================================================
                // Layout:
                //   [Padding 30] [Pareja A: 2 nombres] [VS centro] [Pareja B: 2 nombres] [Padding 30]
                //
                // Cada nombre ocupa como máximo 9 caracteres * ~28px = ~252px.
                // Dos nombres por lado = 252 px de ancho de columna.
                // Total: 30 + 252 + 30 (VS gap) + 60 (VS) + 30 (VS gap) + 252 + 30 = 684 px.
                // El canvas tiene 1080 px, así que podemos centrar las parejas
                // con espacio sobrante por ambos lados, PERO queremos que los nombres
                // sean aún más grandes. Vamos a subir la fuente a 50px.
                //
                // Con 50px, 9 caracteres ~ 280 px. Dos parejas: 30 + 280 + 30 + 60 + 30 + 280 + 30 = 740.
                // Centramos en el canvas.
                // ============================================================

                var parejas = pista.querySelectorAll('.pareja-box');
                var centroX = ancho / 2;
                var filaY = y + (hPista - 10) / 2 + 5;

                if (parejas.length >= 2) {
                    var pA = parejas[0].querySelectorAll('span');
                    var pB = parejas[1].querySelectorAll('span');

                    // Nombre pareja A: alineado a la derecha, pero terminando
                    // a la izquierda del centro
                    var separacionCentro = 40;
                    var xA = centroX - separacionCentro;
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'middle';

                    ctx.fillStyle = '#0056b3';
                    ctx.font = fJugador;
                    ctx.fillText(pA[0] ? pA[0].innerText : '', xA, filaY - 26);

                    ctx.fillStyle = '#b35f00';
                    ctx.font = fJugador;
                    ctx.fillText(pA[1] ? pA[1].innerText : '', xA, filaY + 26);

                    // VS
                    ctx.fillStyle = '#cccccc';
                    ctx.font = fVS;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('VS', centroX, filaY);

                    // Nombre pareja B: alineado a la izquierda, empezando
                    // a la derecha del centro
                    var xB = centroX + separacionCentro;
                    ctx.textAlign = 'left';

                    ctx.fillStyle = '#0056b3';
                    ctx.font = fJugador;
                    ctx.fillText(pB[0] ? pB[0].innerText : '', xB, filaY - 26);

                    ctx.fillStyle = '#b35f00';
                    ctx.font = fJugador;
                    ctx.fillText(pB[1] ? pB[1].innerText : '', xB, filaY + 26);
                }

                y += hPista;
            }

            y += separacionBloques;
        }

        // ============================================================
        // EXPORTAR
        // ============================================================
        exportarCanvas(canvas, torneo, 'cuadro-americano.png');

    } catch (err) {
        console.error('Error generando imagen:', err);
        alert('Error generando la imagen: ' + err.message);
    }
}

function exportarCanvas(canvas, torneo, nombreArchivo) {
    canvas.toBlob(function(blob) {
        var archivo = new File([blob], nombreArchivo, { type: 'image/png' });

        if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
            navigator.share({
                files: [archivo],
                title: 'Cuadro Americano',
                text: 'Cuadro del torneo: ' + torneo
            }).catch(function(err) {
                if (err.name !== 'AbortError') {
                    descargarImagen(blob);
                }
            });
        } else {
            descargarImagen(blob);
        }
    }, 'image/png');
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function descargarImagen(blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'cuadro-americano.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
}

// ============================================================
// REGISTRAR RESULTADO
// ============================================================
function registrar(id) {
    var p = null;
    for (var i = 0; i < partidosData.length; i++) {
        if (partidosData[i].id === id) { p = partidosData[i]; break; }
    }
    if (!p) return;
    p.sA = parseInt(document.getElementById('scA_' + id).value) || 0;
    p.sB = parseInt(document.getElementById('scB_' + id).value) || 0;
    actualizarRanking();
}

// ============================================================
// RANKING
// ============================================================
function actualizarRanking() {
    var globalStats = {};
    for (var id in jugadoresGlobal) {
        globalStats[id] = { nombre: jugadoresGlobal[id], vic: 0, dif: 0 };
    }

    for (var i = 0; i < partidosData.length; i++) {
        var p = partidosData[i];
        if (p.sA === 0 && p.sB === 0) continue;
        var difA = p.sA - p.sB;
        var difB = p.sB - p.sA;

        for (var a = 0; a < p.jA.length; a++) {
            var jugID = p.jA[a];
            if (p.sA > p.sB) globalStats[jugID].vic++;
            globalStats[jugID].dif += difA;
        }
        for (var b = 0; b < p.jB.length; b++) {
            var jugID = p.jB[b];
            if (p.sB > p.sA) globalStats[jugID].vic++;
            globalStats[jugID].dif += difB;
        }
    }

    var lista = [];
    for (var id in globalStats) lista.push(globalStats[id]);
    lista.sort(function(a, b) {
        if (b.vic !== a.vic) return b.vic - a.vic;
        return b.dif - a.dif;
    });

    var html = '';
    for (var i = 0; i < lista.length; i++) {
        var j = lista[i];
        html += '<div class="rank-item">';
        html += '<div class="rank-info">';
        html += '<span class="rank-pos">' + (i+1) + '</span>';
        html += '<span class="rank-name">' + j.nombre + '</span>';
        html += '</div>';
        html += '<div class="rank-stats">';
        html += '<span style="color:var(--rmct-blue)">' + j.vic + 'V</span>';
        html += '<span style="color:#666">| ' + (j.dif > 0 ? '+' + j.dif : j.dif) + '</span>';
        html += '</div></div>';
    }
    document.getElementById('ranking').innerHTML = html;
}
